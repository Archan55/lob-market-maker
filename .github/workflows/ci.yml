name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src/lobmm
      - name: Tests and coverage
        env:
          LOB_COMPONENT_INTEGRATION_EVIDENCE_DIR: experiments/component-integration-ci
        run: python -m pytest --cov=lobmm --cov-report=term-missing
      - name: Deterministic integration backtest
        run: python -m lobmm.cli backtest --config configs/ci.yaml --run-name ci-smoke
      - name: Verify saved lifecycle resource evidence (no new measurements)
        run: |
          mkdir -p experiments
          python -I -B tools/characterize_end_to_end_resources.py \
            --verify-evidence docs/evidence/end-to-end-resources-20261117/run \
            > experiments/lifecycle-resource-verification.json
      - name: Verify retained accounting audit records (integrity only)
        run: |
          python -I -B tools/reconcile_artifact_ledger.py \
            --verify-evidence docs/evidence/artifact-ledger-20261118/run \
            > experiments/artifact-ledger-verification.json
      - name: Reproduce conditional accounting reconciliation (no simulation)
        run: |
          python -I -B tools/reconcile_artifact_ledger.py --run \
            --plan docs/evidence/artifact-ledger-20261118/plan.json \
            --output experiments/artifact-ledger-ci \
            > experiments/artifact-ledger-ci-controller.log
      - name: Verify retained fill-trigger records (integrity only)
        run: |
          python -I -B tools/audit_fill_triggers.py \
            --verify-evidence docs/evidence/fill-trigger-20261119/run \
            > experiments/fill-trigger-verification.json
      - name: Reproduce fill-trigger attribution (no simulation)
        run: |
          python -I -B tools/audit_fill_triggers.py --run \
            --plan docs/evidence/fill-trigger-20261119/plan.json \
            --output experiments/fill-trigger-ci \
            > experiments/fill-trigger-ci-controller.log
      - name: Record executed source identity
        if: always()
        run: |
          mkdir -p experiments
          python - <<'PY'
          import hashlib
          import json
          import platform
          import subprocess
          from pathlib import Path
          import lobmm
          result = {
              "executed_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": platform.python_version(),
              "package_origin": str(Path(lobmm.__file__).resolve()),
              "source_sha256": {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(Path("src/lobmm").rglob("*"))
                  if path.is_file() and "__pycache__" not in path.parts
              },
          }
          Path("experiments/component-integration-ci-provenance.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Retain synthetic integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            experiments/component-integration-ci/
            experiments/component-integration-ci-test-controller.*.log
            experiments/component-integration-ci-provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain verified lifecycle resource records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-resources-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            docs/evidence/end-to-end-resources-20261117/run/
            experiments/lifecycle-resource-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain conditional accounting reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-ledger-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            docs/evidence/artifact-ledger-20261118/
            experiments/artifact-ledger-ci/
            experiments/artifact-ledger-ci-controller.log
            experiments/artifact-ledger-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain fill-trigger attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fill-trigger-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            docs/evidence/fill-trigger-20261119/
            experiments/fill-trigger-ci/
            experiments/fill-trigger-ci-controller.log
            experiments/fill-trigger-verification.json
          if-no-files-found: error
          retention-days: 14
