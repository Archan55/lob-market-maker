# Constructed reservation-to-close mechanics study; each case saves its tape.
instrument:
  symbol: EXPOSURE-STRESS
  tick_size: "0.01"
data:
  validation_mode: strict
  provenance:
    source_type: synthetic
    provider: lobmm exposure session stress v1
    venue: SIMULATED
    symbol: EXPOSURE-STRESS
    dataset_id: exposure-session-stress-v1
