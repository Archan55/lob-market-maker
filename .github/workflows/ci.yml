name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src/lobmm
      - name: Tests and coverage
        run: python -m pytest --cov=lobmm --cov-report=term-missing --latency-study-output experiments/latency-stress-v1
      - name: Deterministic integration backtest
        run: python -m lobmm.cli backtest --config configs/ci.yaml --run-name ci-smoke
      - name: Controlled cancellation-policy experiment and audit
        run: |
          python -m lobmm.cli experiment --config configs/queue_cancellation.yaml --name queue-cancellation --latency-multipliers 0.5,1,2
          python -m lobmm.cli audit-queue-study --experiment experiments/queue-cancellation --config configs/queue_cancellation.yaml
      - name: Save latency-boundary stress evidence
        uses: actions/upload-artifact@v4
        with:
          name: latency-stress-v1-${{ github.sha }}
          path: experiments/latency-stress-v1/
          retention-days: 14
