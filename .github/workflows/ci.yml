name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record executed source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/canonical-fidelity-ci
          git rev-parse HEAD | tee experiments/canonical-fidelity-ci/checkout.txt
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src/lobmm
      - name: Tests and coverage
        run: python -m pytest --cov=lobmm --cov-report=term-missing --junitxml=experiments/canonical-fidelity-ci/full-suite.xml
      - name: Deterministic integration backtest
        run: python -m lobmm.cli backtest --config configs/ci.yaml --run-name ci-smoke
      - name: Archived main and exact-head canonical fidelity verification
        run: |
          python tools/reproduce_canonical_fidelity.py --stage verify \
            --candidate "$(git rev-parse HEAD)" \
            --output experiments/canonical-fidelity-ci/verify
      - name: Verify retained canonical ingestion measurements without timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/canonical-ingestion-cost-ci
          ingestion_head="$(git rev-parse HEAD)"
          printf '%s\n' "$ingestion_head" | tee experiments/canonical-ingestion-cost-ci/checkout.txt
          python - <<'PY' | tee experiments/canonical-ingestion-cost-ci/installed-source-inventory.json
          import hashlib
          import json
          import sys
          from pathlib import Path

          files = sorted(
              path for path in Path("src").rglob("*")
              if path.is_file() and "__pycache__" not in path.parts
          )
          print(json.dumps({
              "python_executable": sys.executable,
              "python_version": sys.version,
              "source_inventory": [path.as_posix() for path in files],
              "lobmm_package_sha256": {
                  path.as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in files if path.is_relative_to(Path("src/lobmm"))
              },
          }, indent=2))
          PY
          ingestion_snapshot="$(mktemp -d "${RUNNER_TEMP}/canonical-ingestion-verify.XXXXXX")"
          git archive --format=tar --output="$ingestion_snapshot/head.tar" "$ingestion_head"
          sha256sum "$ingestion_snapshot/head.tar" | tee experiments/canonical-ingestion-cost-ci/verification-archive.sha256
          mkdir "$ingestion_snapshot/source"
          tar -xf "$ingestion_snapshot/head.tar" -C "$ingestion_snapshot/source"
          python "$ingestion_snapshot/source/tools/benchmark_canonical_ingestion.py" \
            --verify-evidence "$ingestion_snapshot/source/docs/evidence/canonical-ingestion-cost-20261114/local/run" \
            2>&1 | tee experiments/canonical-ingestion-cost-ci/evidence-verification.log
      - name: Retain original synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-fidelity-${{ steps.source.outputs.head_sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            experiments/canonical-fidelity-ci/
            runs/ci-smoke/
            docs/evidence/canonical-fidelity-20261113/
            docs/CANONICAL_INTEGER_FIDELITY.md
            tools/reproduce_canonical_fidelity.py
            tests/unit/test_canonical_fidelity_independent.py
            src/lobmm/data/schema.py
            src/lobmm/data/loaders.py
      - name: Retain canonical ingestion cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-ingestion-cost-${{ steps.source.outputs.head_sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            experiments/canonical-ingestion-cost-ci/
            docs/evidence/canonical-ingestion-cost-20261114/
            docs/CANONICAL_INGESTION_COST.md
            tools/benchmark_canonical_ingestion.py
            tools/canonical_ingestion_oracle.py
