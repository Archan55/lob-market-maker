[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-market-maker"
version = "0.2.0"
description = "Deterministic event-driven Level 2 market-making research simulator"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["market-microstructure", "limit-order-book", "market-making", "backtest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "numpy>=2.0",
  "polars>=1.0",
  "pyarrow>=17",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "matplotlib>=3.9",
  "typer>=0.12",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
lobmm = "lobmm.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lobmm = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: deterministic end-to-end integration tests",
  "property: property and invariant tests",
]

[tool.coverage.run]
branch = true
source = ["lobmm"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@abstractmethod",
  "raise NotImplementedError",
]
