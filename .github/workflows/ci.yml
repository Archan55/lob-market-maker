name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record exact checkout
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src/lobmm
      - name: Tests and coverage
        run: python -m pytest --cov=lobmm --cov-report=term-missing --latency-study-output experiments/latency-stress-v1 --exposure-study-output experiments/exposure-session-stress-v1 --client-stop-study-output experiments/client-stop-stress-v1
      - name: Reproduce exposure and mark defects against pinned prior head
        run: python tools/reproduce_exposure_defects.py
      - name: Verify forced-expiry baseline and unknown-cancel correction
        run: python tools/verify_client_stop_baseline.py
      - name: Record research environment
        run: |
          python --version > experiments/exposure-session-stress-v1/python-version.txt
          python -m pip freeze > experiments/exposure-session-stress-v1/requirements-observed.txt
          git rev-parse HEAD > experiments/exposure-session-stress-v1/checkout-sha.txt
          python --version > experiments/client-stop-stress-v1/python-version.txt
          python -m pip freeze > experiments/client-stop-stress-v1/requirements-observed.txt
          git rev-parse HEAD > experiments/client-stop-stress-v1/checkout-sha.txt
      - name: Deterministic integration backtest
        run: python -m lobmm.cli backtest --config configs/ci.yaml --run-name ci-smoke
      - name: Controlled cancellation-policy experiment and audit
        run: |
          python -m lobmm.cli experiment --config configs/queue_cancellation.yaml --name queue-cancellation --latency-multipliers 0.5,1,2
          python -m lobmm.cli audit-queue-study --experiment experiments/queue-cancellation --config configs/queue_cancellation.yaml
      - name: Save latency-boundary stress evidence
        uses: actions/upload-artifact@v4
        with:
          name: latency-stress-v1-${{ github.sha }}
          path: experiments/latency-stress-v1/
          retention-days: 14
      - name: Save client-stop research and versioned baseline correction
        uses: actions/upload-artifact@v4
        with:
          name: client-stop-stress-v1-${{ steps.revision.outputs.sha }}
          path: |
            experiments/client-stop-stress-v1/
            experiments/client-stop-baseline-v1/
          retention-days: 14
      - name: Save reservation-to-close research evidence
        uses: actions/upload-artifact@v4
        with:
          name: exposure-session-stress-v1-${{ steps.revision.outputs.sha }}
          path: |
            experiments/exposure-session-stress-v1/
            experiments/exposure-defects-v1/
          retention-days: 14
