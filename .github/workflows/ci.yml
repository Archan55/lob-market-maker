name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Record exact source head
        id: source
        run: |
          task_source_sha=$(git rev-parse HEAD)
          echo "head_sha=$task_source_sha" >> "$GITHUB_OUTPUT"
          git log -1 --format=%H
          mkdir -p experiments/exact-risk-ci
          git rev-parse HEAD > experiments/exact-risk-ci/checkout.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src/lobmm
      - name: Tests and coverage
        run: python -m pytest --cov=lobmm --cov-report=term-missing --junitxml=experiments/exact-risk-ci/full.xml
      - name: Deterministic integration backtest
        run: python -m lobmm.cli backtest --config configs/ci.yaml --run-name ci-smoke
      - name: Reproduce pinned risk boundaries before and after
        run: python tools/reproduce_exact_risk.py --stage regression --candidate "$(git rev-parse HEAD)" --output experiments/exact-risk-ci/regression
      - name: Compare exposed integration controls
        run: python tools/reproduce_exact_risk.py --stage integration --candidate "$(git rev-parse HEAD)" --output experiments/exact-risk-ci/integration
      - name: Retain exact-risk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-risk-${{ steps.source.outputs.head_sha }}
          path: |
            experiments/exact-risk-ci/
            docs/evidence/exact-risk-20261105/
            tests/unit/test_risk_exact_thresholds_independent.py
            tools/reproduce_exact_risk.py
            src/lobmm/risk.py
          retention-days: 14
          if-no-files-found: error
